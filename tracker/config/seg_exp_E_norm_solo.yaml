# Experimento E: A/B limpio de la NORMALIZACIÓN de features.
#
# Es el Experimento C copiado tal cual, con UN solo cambio: se estandarizan los
# canales de entrada. Todo lo demás queda idéntico para que el número sea
# directamente comparable contra el de C (IoU_móvil 0.3714 / mIoU 0.6661).
#
# Por qué se repite C y no se sigue desde D:
#   D cambió cuatro cosas a la vez (normalización + num_points 512 + batch 4 +
#   aug) y salió peor en TRAIN además de en val (0.4244 vs 0.5500), o sea que
#   subajustaba. La causa más probable fue bajar num_points: con solo ~5.5% de
#   puntos móviles, pasar de 2048 a 512 deja ~28 puntos móviles por frame en vez
#   de ~113, y para una clase tan rara eso dispara el ruido del gradiente. La
#   duplicación de puntos que yo había llamado "desperdicio" en realidad estaba
#   funcionando como sobremuestreo de una nube muy dispersa.
#
# min_obj_points va en 0 A PROPÓSITO: cuando corrió C la máscara de ignorar
# todavía no existía (el parámetro estaba en el config pero era inerte), así que
# ponerla en 0 hace que la métrica de E mida exactamente lo mismo que la de C.

exp_name: seg_exp_E_norm_solo
mode: train
cuda_device: "0"
seed: 5012

dataset_path: /project/view_of_delft_PUBLIC
num_points: 2048                   # igual que C (NO bajar: ver nota de arriba)
in_channels: 3                     # RCS, v_r, v_r_comp
batch_size: 2                      # igual que C
num_workers: 4
shuffle: false
static_object_handling: filter
fusion: none
fusion_radius: 0.5

# ── EL ÚNICO CAMBIO respecto a C ──────────────────────────────────────────────
# Estadísticas medidas sobre el split de train. El RCS tiene std 14.02 contra
# 2.07 de v_r_comp: entrando crudos, el RCS domina la primera convolución y el
# canal que mejor separa móvil de estático queda ahogado.
feat_mean: [-12.4420, -3.1929, 0.0394]
feat_std:  [14.0193, 2.7273, 2.0658]

# ── Todo lo de abajo es idéntico a C ──────────────────────────────────────────
aug: false
min_obj_points: 0                  # 0 = como corrió C (máscara de ignorar apagada)
gt_box_margin: 0.25

extractor: LocalGlobalFusionSimple

w_moving: 0.7
w_static: 0.3
dice_weight: 0.6
focal_weight: 1.0
focal_alpha: 0.75
focal_gamma: 2.0
feat_contrast_weight: 0.2

epochs: 95
lr: 0.0002
weight_decay: 0.0001
scheduler_patience: 5
scheduler_factor: 0.5
scheduler_min_lr: 0.000001

val_every: 2
# C llegó a su pico en la época 22 y gastó 73 más sin superarlo.
early_stop_patience: 12
checkpoint_dir: /project/tracker/checkpoints

mlflow_enabled: true
mlflow_experiment: segmentacion_vod
